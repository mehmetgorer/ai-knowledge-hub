[project]
name = "ai-knowledge-hub-api"
version = "0.1.0"
description = "FastAPI backend for AI Knowledge Hub"
readme = "README.md"
authors = [
    { name = "Mehmet Görer", email = "mehmetgorer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-knowledge-hub-api = "ai_knowledge_hub_api.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL instance (Docker Compose)",
]
addopts = ["--strict-markers", "-m", "not integration"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
